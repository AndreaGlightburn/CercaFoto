name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Chiave di firma (creata una sola volta e salvata nel repo)
        run: |
          if [ ! -f app/cercafoto.p12.b64 ]; then
            keytool -genkeypair -keystore k.p12 -storetype pkcs12 -storepass cercafoto -keypass cercafoto -alias cercafoto -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Cerca Foto, O=IZ2OII, C=IT"
            base64 -w0 k.p12 > app/cercafoto.p12.b64 && rm k.p12
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/cercafoto.p12.b64
            git commit -m "Aggiunge chiave di firma fissa [skip ci]"
            git push
          fi
      - name: Compila
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verifica privacy (nessun permesso INTERNET)
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/aapt
          $AAPT dump permissions app/build/outputs/apk/release/app-release.apk | tee permessi.txt
          if grep -q "android.permission.INTERNET" permessi.txt; then echo "ERRORE: permesso INTERNET presente"; exit 1; fi
      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CercaFoto.apk
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima CercaFoto.apk --title "Cerca Foto build ${{ github.run_number }}" --notes "Build automatica ${{ github.sha }}" --target ${{ github.sha }}
