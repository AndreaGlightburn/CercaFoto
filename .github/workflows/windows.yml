name: Build Windows
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      DOWNLOAD_TOKEN: ${{ secrets.DOWNLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Modelli CLIP (dalla release modelli-clip)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download modelli-clip -p clip_testo.onnx -p clip_immagine.onnx -p vocab.txt -D desktop/src/main/resources/modelli --clobber
      - name: FFmpeg LGPL (per i video)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          $bin = Get-ChildItem ffx -Recurse -Directory -Filter bin | Select-Object -First 1
          $dest = "desktop/risorse/windows/ffmpeg"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$($bin.FullName)\*" $dest
          Remove-Item "$dest/ffprobe.exe" -ErrorAction SilentlyContinue
          Get-ChildItem ffx -Recurse -Filter "LICENSE*" | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName "$dest/LICENSE-FFmpeg.txt" }
          Get-ChildItem $dest | Format-Table Name, Length
      - name: Prova estrazione fotogrammi
        shell: bash
        run: |
          FF=desktop/risorse/windows/ffmpeg/ffmpeg.exe
          "$FF" -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:d=12" -c:v mpeg4 -g 30 -metadata creation_time=2023-07-14T10:22:31.000000Z prova.mp4
          "$FF" -hide_banner -nostdin -i prova.mp4 2>&1 | grep -E "Duration|Video:|creation_time" || true
          mkdir -p fr
          "$FF" -hide_banner -nostdin -skip_frame nokey -i prova.mp4 -an -sn -dn -vf "select='isnan(prev_selected_t)+gte(t-prev_selected_t,3.00)+gt(scene,0.3)*gte(t-prev_selected_t,1.5)',scale='if(gt(iw,ih),min(1600,iw),-2)':'if(gt(iw,ih),-2,min(1600,ih))',showinfo" -fps_mode vfr -q:v 3 fr/f_%05d.jpg 2>&1 | grep -o "pts_time:[0-9.]*"
          n=$(ls fr | wc -l); echo "fotogrammi: $n"; test "$n" -ge 3
      - name: Compila
        run: gradle -p desktop createDistributable packageMsi --no-daemon --stacktrace
      - name: Prepara i file
        shell: pwsh
        run: |
          Compress-Archive -Path desktop/build/compose/binaries/main/app/CercaFoto -DestinationPath CercaFoto-Windows-portatile.zip
          Copy-Item (Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName CercaFoto-Windows.msi
      - name: Pubblica release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows -y --cleanup-tag || true
          gh release create windows CercaFoto-Windows.msi CercaFoto-Windows-portatile.zip --title "Cerca Foto per Windows build ${{ github.run_number }}" --notes "Installer MSI (per utente, senza diritti di amministratore) e versione portatile ZIP. Build ${{ github.sha }}" --target ${{ github.sha }}
      - name: Pubblica nel repository pubblico dei download
        if: ${{ env.DOWNLOAD_TOKEN != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNLOAD_TOKEN }}
        run: |
          R=AndreaGlightburn/CercaFoto-download
          V=1.0.${{ github.run_number }}
          gh release create "windows-$V" CercaFoto-Windows.msi CercaFoto-Windows-portatile.zip -R $R --title "Cerca Foto per Windows $V" \
            --notes "Installer MSI (per utente, senza diritti di amministratore) e versione portatile ZIP. Si aggiorna installando sopra: indice, persone e impostazioni restano."
          # tiene solo le ultime 3 versioni Windows
          gh release list -R $R --limit 100 --json tagName -q '.[].tagName' | grep '^windows-' | sort -t. -k3 -n -r | tail -n +4 | while read t; do gh release delete "$t" -R $R -y --cleanup-tag; done
